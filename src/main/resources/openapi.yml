openapi: 3.0.3
info:
  title: RLibrary Backend API
  version: 1.0.0
  description: REST API for managing books, authors, and loans in the RLibrary system.
servers:
  - url: http://localhost:8080/api
  - url: /api
paths:
  /authors:
    get:
      summary: Get all authors
      operationId: authorsGet
      tags:
        - Author
      responses:
        '200':
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorDto'
    post:
      summary: Create a new author
      operationId: authorsPost
      tags:
        - Author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorDto'
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDto'
  /authors/{id}:
    get:
      summary: Get author by ID
      operationId: authorsIdGet
      tags:
        - Author
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Author found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDto'
        '404':
          description: Author not found
    delete:
      summary: Delete author by ID
      operationId: authorsIdDelete
      tags:
        - Author
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Author deleted
        '404':
          description: Author not found
  /books:
    get:
      summary: Get all books
      operationId: booksGet
      tags:
        - Book
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookDto'
    post:
      summary: Create a new book
      operationId: booksPost
      tags:
        - Book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookDto'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDto'
  /books/{id}:
    get:
      summary: Get book by ID
      operationId: booksIdGet
      tags:
        - Book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDto'
        '404':
          description: Book not found
  /libraries:
    get:
      summary: Get all libraries
      operationId: librariesGet
      tags:
        - Library
      responses:
        '200':
          description: List of libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryDto'
    post:
      summary: Create a new library
      operationId: librariesPost
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryDto'
      responses:
        '201':
          description: Library created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryDto'
  /libraries/{id}:
    get:
      summary: Get library by ID
      operationId: librariesIdGet
      tags:
        - Library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Library found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryDto'
        '404':
          description: Library not found
    delete:
      summary: Delete library by ID
      operationId: librariesIdDelete
      tags:
        - Library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Library deleted
        '404':
          description: Library not found
  /libraries/{id}/books:
    get:
      summary: Get books for a library
      operationId: librariesIdBooksGet
      tags:
        - Library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of books in the library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookDto'
        '404':
          description: Library not found
  /loans:
    get:
      summary: Get all loans
      operationId: loansGet
      tags:
        - Loan
      responses:
        '200':
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanDto'
    post:
      summary: Create a new loan
      operationId: loansPost
      tags:
        - Loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanDto'
      responses:
        '201':
          description: Loan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanDto'
  /loans/{id}:
    get:
      summary: Get loan by ID
      operationId: loansIdGet
      tags:
        - Loan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Loan found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanDto'
        '404':
          description: Loan not found
    delete:
      summary: Delete loan by ID
      operationId: loansIdDelete
      tags:
        - Loan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Loan deleted
        '404':
          description: Loan not found
  /persons:
    get:
      summary: Get all persons
      operationId: personsGet
      tags:
        - Person
      responses:
        '200':
          description: List of persons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonDto'
    post:
      summary: Create a new person
      operationId: personsPost
      tags:
        - Person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDto'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
  /persons/{id}:
    get:
      summary: Get person by ID
      operationId: personsIdGet
      tags:
        - Person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Person found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '404':
          description: Person not found
    delete:
      summary: Delete person by ID
      operationId: personsIdDelete
      tags:
        - Person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Person deleted
        '404':
          description: Person not found
components:
  schemas:
    AuthorDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
    BookDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        isbn:
          type: string
        authorId:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        libraryName:
          type: string
          readOnly: true
        publishedYear:
          type: integer
    LibraryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        country:
          type: string
        city:
          type: string
        street:
          type: string
        streetNumber:
          type: string
        description:
          type: string
        libraryStatsId:
          type: integer
          format: int64
        libraryRuleId:
          type: integer
          format: int64
        bookIds:
          type: array
          items:
            type: integer
            format: int64
    LoanDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        loanDate:
          type: string
          format: date
        returnDate:
          type: string
          format: date
        status:
          type: string
        personId:
          type: integer
          format: int64
        loanRuleId:
          type: integer
          format: int64
        bookIds:
          type: array
          items:
            type: integer
            format: int64
    PersonDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        firstName:
          type: string
          description: First name of the person
        lastName:
          type: string
          description: Last name of the person
        birthDate:
          type: string
          format: date
          description: Date of birth
        functie:
          type: string
          description: Role or function (e.g., MEMBER, STAFF, MANAGER)
        badgeCode:
          type: string
          description: Unique badge code for identification
        activeLibraryId:
          type: integer
          format: int64
          description: ID of the library where the person is currently active
        accountStatus:
          type: string
          description: Account status (e.g., ACTIVE, SUSPENDED)
        personalStatsId:
          type: integer
          format: int64
          description: ID of the personal statistics entity
        loanIds:
          type: array
          items:
            type: integer
            format: int64
          description: List of loan IDs associated with the person
        bookComplaintIds:
          type: array
          items:
            type: integer
            format: int64
          description: List of book complaint IDs made by the person
      description: DTO representing a person in the library system, including identity, role, and relationships.
