<a
  [routerLink]="['/books', book.id]"
  class="flex flex-col gap-2 rounded-xl border border-slate-200 bg-white p-3 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500"
>
  <div class="aspect-[2/3] w-full overflow-hidden rounded-lg bg-slate-100 relative">
    @if (book.coverImage && book.coverImage !== 'R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==') {
      <img [src]="'data:image/jpeg;base64,' + book.coverImage" class="h-full w-full object-cover" [alt]="'Kaft van ' + book.title" />
    } @else {
      <img src="commingsoon.png" class="h-full w-full object-cover" [alt]="'Geen afbeelding beschikbaar'" />
    }
  </div>
  <div class="mt-1">
    <h3 class="font-bold text-slate-900 line-clamp-1" [title]="book.title">{{ book.title }}</h3>
    <p class="text-xs text-slate-500">{{ book.libraryName }}</p>
    <p class="text-xs text-slate-400 mt-1">{{ book.publishedYear }}</p>
  </div>
</a>
