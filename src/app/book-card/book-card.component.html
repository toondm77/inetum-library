<a
  [routerLink]="['/books', book.id]"
  class="flex flex-col gap-2 rounded-xl border border-slate-200 bg-white p-3 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500"
>
  <div class="aspect-[2/3] w-full overflow-hidden rounded-lg bg-slate-100 relative">
    <!-- Placeholder for book cover since API doesn't provide one yet -->
    <div class="absolute inset-0 grid place-items-center text-slate-300">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-12 w-12" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
        </svg>
    </div>
  </div>
  <div class="mt-1">
    <h3 class="font-bold text-slate-900 line-clamp-1" [title]="book.title">{{ book.title }}</h3>
    <p class="text-xs text-slate-500">{{ book.libraryName }}</p>
    <p class="text-xs text-slate-400 mt-1">{{ book.publishedYear }}</p>
  </div>
</a>
